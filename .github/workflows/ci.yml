name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TURSO_DATABASE_URL: "file:./ci.db"
      HUNTER_PIN: "0000"
      SESSION_SECRET: "ci-secret-ci-secret-ci-secret-ok"
      HUNTER_TZ_OFFSET_MINUTES: "420"
    steps:
      - uses: actions/checkout@v4
      # pnpm must be installed BEFORE setup-node, since cache: pnpm
      # requires the pnpm binary to already exist.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Lint (includes architecture boundary rules)
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: Tests with coverage thresholds
        run: pnpm test:coverage

      - name: Production build
        run: pnpm build
